{% extends "base.html" %}

{% block title %}Подтверждение — MotoHub{% endblock %}

{% block content %}

<div class="form">

    <div class="tag">GMAIL OTP</div>

    <h1>Введите код</h1>

    <p class="muted">
        Код подтверждения отправлен на
        <b>{{ email }}</b>
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post" action="/auth/verify">

        <input
            type="hidden"
            name="email"
            value="{{ email }}"
        >

        <input
            class="input otp-input"
            type="text"
            name="code"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            autocomplete="one-time-code"
            placeholder="123456"
            required
            autofocus
        >

        <button class="btn" type="submit">
            Подтвердить
        </button>

    </form>

    <p class="muted" style="margin-top:14px">
        Код действует 10 минут.
    </p>

</div>

<script>
const otp = document.querySelector(".otp-input");

if (otp) {
    otp.addEventListener("input", function () {
        this.value = this.value
            .replace(/\D/g, "")
            .slice(0, 6);
    });
}
</script>

{% endblock %}
