{% extends "base.html" %}{% block title %}MotoHub — Чат{% endblock %}{% block content %}
<style>.chatapp{height:calc(100vh - 72px);display:grid;grid-template-columns:300px 1fr;background:#0b0d0e}.side{border-right:1px solid #25292b;background:#111314;overflow:auto}.sidehead{padding:20px;border-bottom:1px solid #25292b}.search{width:100%;padding:12px;border-radius:10px;background:#090a0b;color:#fff;border:1px solid #333}.tabs{display:flex;gap:8px;margin-top:12px}.tab{flex:1;padding:9px;border:1px solid #333;background:#171a1b;color:#bbb;border-radius:9px;cursor:pointer}.tab.active{background:#b8ff00;color:#090a0b;font-weight:800}.person{padding:12px 14px;border-bottom:1px solid #202325;cursor:pointer;display:flex;justify-content:space-between;gap:10px}.personleft{display:flex;gap:10px;align-items:center;min-width:0}.miniavatar{width:40px;height:40px;border-radius:50%;object-fit:cover;background:#222;flex:0 0 auto}.miniavatar.placeholder{display:grid;place-items:center}.person:hover,.person.sel{background:#1b1f20}.dot{width:8px;height:8px;border-radius:50%;background:#555;display:inline-block;margin-right:7px}.dot.on{background:#b8ff00}.badge{background:#b8ff00;color:#090a0b;border-radius:20px;padding:3px 7px;font-size:11px;font-weight:900}.mainchat{display:flex;flex-direction:column;min-width:0}.chathead{padding:18px 24px;border-bottom:1px solid #25292b;background:#101213}.messages{flex:1;overflow:auto;padding:22px}.bubble{max-width:70%;padding:10px 13px;border-radius:14px;background:#171b1c;margin:7px 0}.mine{margin-left:auto;background:#b8ff00;color:#090a0b}.meta{font-size:11px;opacity:.6;margin-top:5px}.composer{display:flex;gap:10px;padding:16px;border-top:1px solid #25292b}.composer .input{margin:0}.empty{height:100%;display:grid;place-items:center;color:#777;text-align:center;padding:30px}@media(max-width:750px){.chatapp{grid-template-columns:100px 1fr}.sidehead{padding:10px}.person{padding:12px 8px}.person .pname{display:none}.tabs{flex-direction:column}.messages{padding:12px}.bubble{max-width:88%}}</style>
<div class="chatapp"><aside class="side"><div class="sidehead"><b>Сообщения</b><input id="search" class="search" placeholder="Поиск..." style="margin-top:12px"><div class="tabs"><button class="tab active" data-tab="people">Личка</button><button class="tab" data-tab="public">Клуб</button></div></div><div id="people"></div></aside><main class="mainchat"><div class="chathead"><b id="chatTitle">Общий чат клуба</b><div class="small" id="chatStatus">Все участники</div></div><div id="messages" class="messages"></div><form id="composer" class="composer"><input id="text" class="input" autocomplete="off" placeholder="Написать сообщение..."><button class="btn">Отправить</button></form></main></div>
<script>
const me={{user.id}}, myEmail={{user.email|tojson}}; let users=[], selected=null, mode='public', ws=null, online=new Set(); const people=document.getElementById('people'), messages=document.getElementById('messages');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function name(u){return u.display_name||u.email.split('@')[0]}
function renderPeople(filter=''){people.innerHTML=users.filter(u=>(name(u)+' '+u.email).toLowerCase().includes(filter.toLowerCase())).map(u=>`<div class="person ${selected&&selected.id===u.id?'sel':''}" data-id="${u.id}"><div class="personleft">${u.avatar_url?`<img class="miniavatar" src="${esc(u.avatar_url)}">`:`<div class="miniavatar placeholder">🏍️</div>`}<span class="dot ${online.has(u.id)?'on':''}"></span><span class="pname"><b>${esc(name(u))}</b><br><span class="small">${esc(u.motorcycle||u.email)}</span></span></div><span class="badge" id="badge-${u.id}" style="display:none">0</span></div>`).join('');document.querySelectorAll('.person').forEach(x=>x.onclick=()=>selectUser(+x.dataset.id))}
async function loadUsers(){users=await fetch('/api/chat/users').then(r=>r.json());renderPeople(document.getElementById('search').value);loadUnread()}
async function loadUnread(){let a=await fetch('/api/chat/unread').then(r=>r.json());a.forEach(x=>{let u=users.find(u=>u.email===x.email);if(u){let b=document.getElementById('badge-'+u.id);if(b){b.textContent=x.count;b.style.display='inline-block'}}})}
function add(m){let mine=m.email===myEmail;let d=document.createElement('div');d.className='bubble '+(mine?'mine':'');d.innerHTML=`<b>${mine?'Вы':esc(m.display_name||m.email)}</b><div>${esc(m.text)}</div><div class="meta">${new Date(m.created_at+'Z').toLocaleString()}</div>`;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}
async function publicLoad(){mode='public';selected=null;document.getElementById('chatTitle').textContent='Общий чат клуба';document.getElementById('chatStatus').textContent='Все участники';messages.innerHTML='';if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:'request_public'}))}
async function selectUser(id){selected=users.find(u=>u.id===id);mode='dm';document.getElementById('chatTitle').textContent=name(selected);document.getElementById('chatStatus').textContent=online.has(id)?'● онлайн':'○ офлайн';messages.innerHTML='';let arr=await fetch('/api/chat/messages/'+id).then(r=>r.json());arr.forEach(add);await fetch('/api/chat/read/'+id,{method:'POST'});let b=document.getElementById('badge-'+id);if(b)b.style.display='none';renderPeople(document.getElementById('search').value)}
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/chat');ws.onmessage=e=>{let x=JSON.parse(e.data);if(x.type==='presence'){online=new Set(x.online);renderPeople(document.getElementById('search').value);if(selected)document.getElementById('chatStatus').textContent=online.has(selected.id)?'● онлайн':'○ офлайн';return}if(x.type==='public'){if(mode==='public')add(x.message);return}if(x.type==='dm'){let m=x.message;let sender=users.find(u=>u.email===m.email);let belongs=mode==='dm'&&selected&&((m.email===myEmail&&m.recipient_id===selected.id)||(sender&&sender.id===selected.id));if(belongs){add(m);if(m.email!==myEmail) fetch('/api/chat/read/'+selected.id,{method:'POST'});}else if(m.email!==myEmail&&sender){let b=document.getElementById('badge-'+sender.id);if(b){b.textContent=+(b.textContent||0)+1;b.style.display='inline-block'}}}};ws.onclose=()=>setTimeout(connect,1500)}
document.getElementById('composer').onsubmit=e=>{e.preventDefault();let t=document.getElementById('text');if(!t.value.trim()||!ws||ws.readyState!==1)return;ws.send(JSON.stringify({text:t.value,recipient_id:mode==='dm'&&selected?selected.id:null}));t.value=''};
document.getElementById('search').oninput=e=>renderPeople(e.target.value);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.tab==='public')publicLoad();else{mode='dm';document.getElementById('chatTitle').textContent='Личные сообщения';messages.innerHTML='<div class="empty">Выберите участника слева, чтобы начать личную переписку.</div>'}});loadUsers();connect();
</script>{% endblock %}
