```html
{% extends "base.html" %}

{% block title %}Новый пароль — MotoHub{% endblock %}

{% block content %}

<div class="form">

    <div class="tag">NEW PASSWORD</div>

    <h1>Новый пароль</h1>

    <p class="muted">
        Код отправлен на
        <b>{{ email }}</b>
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post" action="/auth/reset">

        <input
            type="hidden"
            name="email"
            value="{{ email }}"
        >

        <input
            class="input otp-input"
            type="text"
            name="code"
            inputmode="numeric"
            pattern="[0-9]{6}"
            maxlength="6"
            autocomplete="one-time-code"
            placeholder="Код из Gmail"
            required
        >

        <input
            class="input"
            type="password"
            name="password"
            placeholder="Новый пароль"
            autocomplete="new-password"
            minlength="6"
            required
        >

        <button class="btn" type="submit">
            Сменить пароль
        </button>

    </form>

</div>

<script>
document.querySelectorAll(".otp-input").forEach(function (input) {

    input.addEventListener("input", function () {

        this.value = this.value
            .replace(/\D/g, "")
            .slice(0, 6);

    });

});
</script>

{% endblock %}
```
